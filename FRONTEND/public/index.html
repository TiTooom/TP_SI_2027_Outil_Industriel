<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervision Process</title>
  <!-- Bibliothèques servies en local : le réseau d'usine n'a pas forcément accès à Internet. -->
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar border-bottom border-secondary-subtle px-3">
    <span class="navbar-brand fw-semibold">🏭 Supervision Process</span>
    <span class="text-secondary small">Prototype open source</span>
  </nav>

  <main class="container py-4">
    <h1 class="h4 mb-1">État du système</h1>
    <p class="text-secondary mb-4">Le tableau de bord et la configuration des automates arrivent aux prochaines étapes.</p>

    <div class="row g-3" id="health-cards">
      <div class="col-12 col-md-4">
        <div class="status-card">
          <div class="status-label">Application</div>
          <div class="status-value"><span class="dot" data-key="app"></span><span data-text="app">Vérification…</span></div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="status-card">
          <div class="status-label">Base de données — API</div>
          <div class="status-value"><span class="dot" data-key="api"></span><span data-text="api">Vérification…</span></div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="status-card">
          <div class="status-label">Base de données — relevés</div>
          <div class="status-value"><span class="dot" data-key="poller"></span><span data-text="poller">Vérification…</span></div>
        </div>
      </div>
    </div>

    <p class="text-secondary small mt-4" id="last-check" aria-live="polite"></p>
  </main>

  <script type="module" src="js/health.js"></script>
</body>
</html>
